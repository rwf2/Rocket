[package]
name = "rocket_codegen"
version = "0.6.0-rc.1"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "Procedural macros for the Rocket web framework."
documentation = "https://api.rocket.rs/v0.6-rc/rocket_codegen/"
homepage = "https://rocket.rs"
repository = "https://github.com/rwf2/Rocket"
readme = "../../README.md"
keywords = ["rocket", "web", "framework", "code", "generation"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.95"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
indexmap = "2.2.3"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = "1.0.107"
devise = "0.5"
proc-macro2-diagnostics = { version = "0.11", features = ["nightly"] }
rocket_http = { version = "=0.6.0-rc.1", path = "../http/" }
percent-encoding = "2.3.2"
unicode-xid = "0.2.2"
version_check = "0.9.4"
glob = "0.3"

[dev-dependencies]
rocket = { path = "../lib", features = ["json", "msgpack"] }
time = { version =  "0.3.47", features = ["macros"] }
pretty_assertions = "1.3.0"
version_check = "0.9.4"
trybuild = "1.0"
