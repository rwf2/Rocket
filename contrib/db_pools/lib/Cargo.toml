[package]
name = "rocket_db_pools"
version = "0.3.0"
authors = ["Sergio Benitez <sb@sergio.bz>", "Jeb Rosen <jeb@jebrosen.com>"]
description = "Rocket async database pooling support"
repository = "https://github.com/rwf2/Rocket/tree/v0.5/contrib/db_pools"
readme = "../README.md"
keywords = ["rocket", "framework", "database", "pools"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.89"

[package.metadata.docs.rs]
all-features = true

[features]
# deadpool features
deadpool_postgres = ["deadpool-postgres", "deadpool"]
deadpool_redis = ["deadpool-redis", "deadpool"]
# sqlx features
sqlx = ["dep:sqlx", "dep:rustls", "dep:rustls-webpki", "dep:webpki-roots"]
sqlx_mysql = ["sqlx", "sqlx/mysql"]
sqlx_postgres = ["sqlx", "sqlx/postgres"]
sqlx_sqlite = ["sqlx", "sqlx/sqlite"]
sqlx_macros = ["sqlx", "sqlx/macros"]
# diesel features
diesel_postgres = ["diesel-async/postgres", "diesel-async/deadpool", "diesel", "deadpool_13"]
diesel_mysql = ["diesel-async/mysql", "diesel-async/deadpool", "diesel", "deadpool_13"]
# mongodb features
mongodb = ["dep:mongodb", "dep:rustls", "dep:rustls-webpki", "dep:webpki-roots"]

[dependencies.rocket]
path = "../../../core/lib"
version = "0.5.2"
default-features = false

[dependencies.rocket_db_pools_codegen]
path = "../codegen"
version = "=0.3.0"

[dependencies.deadpool_13]
package = "deadpool"
version = "0.13.1"
default-features = false
features = ["rt_tokio_1", "managed"]
optional = true

[dependencies.deadpool-postgres]
version = "0.13.2"
default-features = false
features = ["rt_tokio_1"]
optional = true

[dependencies.deadpool]
version = "0.12.1"
default-features = false
features = ["rt_tokio_1", "managed"]
optional = true

[dependencies.deadpool-redis]
version = "0.15"
default-features = false
features = ["rt_tokio_1"]
optional = true

[dependencies.mongodb]
version = "3.9.1"
default-features = false
features = ["compat-3-0-0", "rustls-tls", "dns-resolver"]
optional = true

[dependencies.diesel-async]
version = "0.10.0"
default-features = false
optional = true

[dependencies.diesel]
version = "2.4.0"
default-features = false
optional = true

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = ["runtime-tokio", "tls-rustls-ring"]
optional = true

[dependencies.rustls]
version = "0.23.46"
default-features = false
features = ["ring", "std", "tls12"]
optional = true

[dependencies.rustls-webpki]
version = "0.103.16"
default-features = false
optional = true

[dependencies.webpki-roots]
version = "1.0.10"
optional = true

[dev-dependencies.rocket]
path = "../../../core/lib"
default-features = false
features = ["json"]

[build-dependencies]
version_check = "0.9"
