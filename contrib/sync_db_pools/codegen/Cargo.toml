[package]
name = "rocket_sync_db_pools_codegen"
version = "0.3.0-dev"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "Procedural macros for rocket_sync_db_pools."
repository = "https://github.com/rwf2/Rocket/tree/master/contrib/sync_db_pools"
readme = "../README.md"
keywords = ["rocket", "framework", "database", "pools"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.95"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
quote = "1.0.47"
devise = "0.5"
proc-macro2-diagnostics = { version = "0.11", features = ["nightly"] }

[dev-dependencies]
version_check = "0.9.4"
trybuild = "1.0"
rocket_sync_db_pools = { path = "../lib" }
rocket = { path = "../../../core/lib" }
