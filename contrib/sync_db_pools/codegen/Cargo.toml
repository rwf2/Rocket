[package]
name = "rocket_sync_db_pools_codegen"
version = "0.2.0"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "Procedural macros for rocket_sync_db_pools."
repository = "https://github.com/rwf2/Rocket/tree/v0.5/contrib/sync_db_pools"
readme = "../README.md"
keywords = ["rocket", "framework", "database", "pools"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.89"

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
devise = "0.5.0"
proc-macro2-diagnostics = { version = "0.11.0", features = ["nightly"] }

[dev-dependencies]
version_check = "0.9"
trybuild = "1.0"
rocket_sync_db_pools = { path = "../lib" }
rocket = { path = "../../../core/lib" }
