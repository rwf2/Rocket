[package]
name = "rocket_sync_db_pools"
version = "0.2.0"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "Rocket async database pooling support for sync database drivers."
repository = "https://github.com/rwf2/Rocket/tree/v0.5/contrib/sync_db_pools"
readme = "../README.md"
keywords = ["rocket", "framework", "database", "pools"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.89"

[features]
diesel_sqlite_pool = ["diesel/sqlite", "diesel/r2d2"]
diesel_postgres_pool = ["diesel/postgres", "diesel/r2d2"]
diesel_mysql_pool = ["diesel/mysql", "diesel/r2d2"]
sqlite_pool = ["rusqlite", "r2d2_sqlite"]
postgres_pool = ["postgres", "r2d2_postgres"]
memcache_pool = ["memcache"]

[dependencies]
r2d2 = "0.8"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }

diesel = { version = "2.3.14", default-features = false, optional = true }

postgres = { version = "0.19", optional = true }
r2d2_postgres = { version = "0.18", optional = true }

rusqlite = { version = ">=0.39.0, <0.43", optional = true }
r2d2_sqlite = { version = ">=0.34.0, <0.38", optional = true }

memcache = { version = "0.21", optional = true }

[dependencies.rocket_sync_db_pools_codegen]
version = "=0.2.0"
path = "../codegen"

[dependencies.rocket]
version = "0.5.2"
path = "../../../core/lib"
default-features = false

[build-dependencies]
version_check = "0.9.1"

[package.metadata.docs.rs]
all-features = true
