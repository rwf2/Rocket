[package]
name = "rocket_ws"
version = "0.2.0"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "WebSocket support for Rocket."
documentation = "https://api.rocket.rs/v0.5/rocket_ws/"
homepage = "https://rocket.rs"
repository = "https://github.com/rwf2/Rocket/tree/v0.5/contrib/ws"
readme = "README.md"
keywords = ["rocket", "web", "framework", "websocket"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.89"

[features]
default = ["tungstenite"]
tungstenite = ["tokio-tungstenite"]

[dependencies]
tokio-tungstenite = { version = "0.30", optional = true }
data-encoding = "2"

[dependencies.rocket]
version = "0.5.2"
path = "../../core/lib"
default-features = false

[package.metadata.docs.rs]
all-features = true
