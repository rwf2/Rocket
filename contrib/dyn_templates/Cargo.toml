[package]
name = "rocket_dyn_templates"
version = "0.3.0"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "Dynamic templating engine integration for Rocket."
documentation = "https://api.rocket.rs/v0.5/rocket_dyn_templates/"
homepage = "https://rocket.rs"
repository = "https://github.com/rwf2/Rocket/tree/v0.5/contrib/dyn_templates"
readme = "README.md"
keywords = ["rocket", "framework", "templates", "templating", "engine"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.89"

[features]
tera = ["dep:tera"]
handlebars = ["dep:handlebars"]
minijinja = ["dep:minijinja"]

[dependencies]
walkdir = "2.5.0"
notify = "8.2.1"
normpath = "1.5.2"

tera = { version = "2.4.0", optional = true }
handlebars = { version = "6.4.4", optional = true }

[dependencies.minijinja]
version = "3.0.3"
optional = true
features = ["serde", "speedups", "json", "urlencode"]

[dependencies.rocket]
version = "0.5.3"
path = "../../core/lib"
default-features = false

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[package.metadata.docs.rs]
all-features = true
