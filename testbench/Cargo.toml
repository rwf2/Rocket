[package]
name = "testbench"
description = "End-to-end HTTP Rocket testbench."
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
thiserror = "2"
procspawn = "1"
pretty_assertions = "1.4.0"
ipc-channel = "0.23"
rustls-pki-types = { version = "1.9", features = ["std"] }
inventory = "0.3.15"

[dependencies.nix]
version = "0.32"
features = ["signal"]

[dependencies.rocket]
path = "../core/lib/"
features = ["secrets", "tls", "mtls"]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls", "charset", "cookies", "blocking", "http2"]
